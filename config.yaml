# 新闻智能体配置
# 修改此文件后无需改代码；不存在的项会使用内置默认值

timezone: "Asia/Shanghai"
max_items: 400          # 单日最多收录条数
per_source_limit: 40    # 每个信源最多取多少条
fetch_timeout: 12       # 单源抓取超时（秒）
dedup_threshold: 0.86   # 标题相似度大于该值视为重复
min_title_len: 10
max_key_points: 6

# LLM（可选）：不填 OPENAI_API_KEY 时自动使用本地抽取式摘要
# 兼容 DeepSeek / 智谱 / Kimi 等 OpenAI 格式端点，只需配置 base_url 与 key
llm:
  provider: auto        # auto / openai / none
  base_url: ""
  model: ""

